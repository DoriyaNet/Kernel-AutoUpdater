[updater]
# build: download kernel.org sources and compile locally
# package: install prebuilt kernels from the distro repository (apt/dnf)
update_method = build
# stable | longterm | mainline | longterm:6.12
channel = stable
feed_url = https://www.kernel.org/releases.json
feed_timeout = 30
download_timeout = 120
work_dir = /var/lib/kernel-autoupdater
log_file = /var/log/kernel-autoupdater.log

# The timer only checks when this is false. Set it to true to install
# new kernels automatically.
auto_update = false
auto_reboot = false
reboot_delay_minutes = 5
min_free_gb = 12

[source]
# Requires gpg plus a keyring containing the kernel.org release key.
verify_pgp = false
pgp_keyring = /etc/kernel-autoupdater/kernel.org-keyring.gpg
# Only needed for mainline/RC tarballs with no sha256sums.asc or .tar.sign.
allow_unverified = false
patches_dir = /etc/kernel-autoupdater/patches

[build]
# auto: use /boot/config-$(uname -r), /proc/config.gz or
#       /lib/modules/$(uname -r)/config
# defconfig: use make defconfig (may omit drivers for this machine)
# or an absolute path to a kernel config file
config_source = auto
localversion = -kau
# 0 means one job per CPU
jobs = 0
# Keep the compiled source tree after a successful install (uses a lot of disk)
keep_build_dir = false
# Debian/Ubuntu configs point at distro signing keys that are not in the
# vanilla source tree. Clearing them keeps the build working.
clear_distro_keys = true

[packages]
# auto | apt | dnf
manager = auto
# auto picks linux-image-generic/linux-image-<arch> or kernel
kernel_packages = auto
refresh_package_index = true
min_free_gb = 2

[install]
update_initramfs = true
update_bootloader = true

